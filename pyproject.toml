[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yi-cloud-probe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.scripts]
yi_cloud_probe = "yi_cloud_probe:main"

[tool.setuptools]
py-modules = ["yi_cloud_probe"]
